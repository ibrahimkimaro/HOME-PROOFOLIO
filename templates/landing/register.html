{{define "content"}}
<div class="auth-card">
  <div class="auth-card-header">
    <a href="/" style="display:inline-block; text-decoration:none;" title="Return to Homepage">
      <img src="/static/images/home-profolio-logo.jpeg" alt="Proofolio Logo" style="width:58px; height:58px; border-radius:var(--radius-md); object-fit:cover; border:2px solid var(--border-stone); margin:0 auto 1.1rem; display:block; box-shadow:var(--shadow-card);">
    </a>
    <h1 class="auth-card-title">Create Proofolio</h1>
    <p class="auth-card-subtitle">Establish your living, verifiable proof of work</p>
  </div>

  <!-- Animated Tab Switcher Track -->
  <div class="auth-tab-track" data-active="register">
    <div class="auth-tab-pill"></div>
    <a href="/login{{if .Redirect}}?redirect={{.Redirect}}{{end}}" class="auth-tab-btn">Sign In</a>
    <a href="/register{{if .Redirect}}?redirect={{.Redirect}}{{end}}" class="auth-tab-btn active">Create Account</a>
  </div>

  <div id="register-error-box"></div>

  <form hx-post="/auth/register" hx-target="#register-error-box" class="auth-form">
    {{if .Redirect}}
    <input type="hidden" name="redirect" value="{{.Redirect}}">
    {{end}}
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" name="displayName" class="form-input" placeholder="e.g. Alex M. Chen" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-input" placeholder="e.g. alex_systems" required>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-input" placeholder="alex@company.io" required>
    </div>

    <div class="form-group">
      <label class="form-label">Specialization &amp; Discipline</label>
      <select name="category" class="form-select">
        <option value="hr">👥 Human Resources (HR) &amp; Talent Operations</option>
        <option value="business">📊 Business Administration, Operations &amp; Management</option>
        <option value="engineer">💻 Software Engineers &amp; Systems Architects</option>
        <option value="student">🎓 Students &amp; Academic Graduates</option>
        <option value="founder">💼 Entrepreneurs, Founders &amp; Business Leaders</option>
        <option value="doctor">🩺 Medical Specialists &amp; Healthcare Researchers</option>
        <option value="coworker">🤝 Cross-Functional Teams &amp; Collaborators</option>
        <option value="cybersecurity">🛡️ Cybersecurity &amp; Infrastructure Specialists</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-input" placeholder="At least 6 characters" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem; padding:0.8rem;">
      Create My Verified Portfolio &rarr;
    </button>

    <div style="margin-top:1.5rem; text-align:center; font-size:0.8rem; color:var(--text-muted);">
      By registering, you agree to public verified proof-of-work guidelines.
    </div>
  </form>
</div>
{{end}}
