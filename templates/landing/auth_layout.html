<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Proofolio</title>
  <meta name="description" content="Sign in or create your verified Proofolio engineering portfolio.">

  <link rel="icon" type="image/jpeg" href="/static/images/home-profolio-logo.jpeg">

  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- Local HTMX Engine -->
  <script src="/static/js/htmx.min.js"></script>

  <!-- Instant Theme Bootstrap -->
  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem('proofolio_theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) { }
    })();
  </script>
</head>

<body class="auth-standalone-layout">

  <!-- Independent Auth Navigation Bar (Return to Homepage + Theme Switcher) -->
  <header class="auth-top-bar">
    <a href="/" class="auth-return-btn" title="Return to Homepage">
      <span style="font-size:1.05rem; line-height:1;">&larr;</span>
      <span>Return to Home Proofolio</span>
    </a>

    <button onclick="toggleTheme()" class="theme-toggle-btn" id="theme-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
      🌓
    </button>
  </header>

  <!-- Dedicated Centered Auth Card Container -->
  <main class="auth-content-wrap">
    {{template "content" .}}
  </main>

  <!-- Minimal Discrete Auth Footer -->
  <footer class="auth-mini-footer">
    &copy; 2026 <strong>Proofolio Platform Inc.</strong> &bull; Universal Proof-of-Work Standard &bull;
    <a href="/about" style="color:var(--color-terracotta); text-decoration:none;">Platform Architecture</a>
  </footer>

  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('proofolio_theme', next);
    }
  </script>
</body>
</html>
