<!-- Document Problem Solved Modal Partial -->
<div class="fixed inset-0 z-50 bg-[#2B2A28]/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto animate-fade-in">
  <div class="w-full max-w-2xl p-6 sm:p-8 rounded-3xl bg-[#FAF7F2] border border-[#C4BCB2] shadow-2xl space-y-6 my-auto max-h-[95vh] overflow-y-auto">
    
    <div class="flex items-center justify-between pb-4 border-b border-[#C4BCB2]">
      <div>
        <div class="text-[10px] font-mono uppercase tracking-wider text-amber-700 font-bold">
          Proofolio &bull; Proof of Problem Solving
        </div>
        <h3 class="text-2xl font-serif font-bold text-[#2B2A28]">
          Document a Problem You Solved
        </h3>
      </div>
      <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#F0EBE3] border border-[#C4BCB2] flex items-center justify-center text-sm font-bold text-[#8C8378] hover:text-[#2B2A28] cursor-pointer">
        &times;
      </button>
    </div>

    <form onsubmit="handleProblemModalSubmit(event)" class="space-y-4">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
            Problem Title / Core Incident *
          </label>
          <input
            id="new-prob-title"
            type="text"
            required
            placeholder="e.g. Race Condition Ledger Anomaly in M-Pesa IPN"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
          />
        </div>

        <div>
          <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
            Domain / Category *
          </label>
          <input
            id="new-prob-domain"
            type="text"
            required
            placeholder="e.g. FinTech & Databases, Cybersecurity, Distributed Systems"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
          />
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
          Observed Symptoms / Failure Mode *
        </label>
        <textarea
          id="new-prob-symptoms"
          rows="2"
          required
          placeholder="What broke? What were the symptoms or error spikes observed in production or testing?"
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
        ></textarea>
      </div>

      <div>
        <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
          Root Cause Discovered
        </label>
        <textarea
          id="new-prob-rootcause"
          rows="2"
          placeholder="What was the underlying bug, design flaw, misconfiguration, or concurrency hazard?"
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
        ></textarea>
      </div>

      <div>
        <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
          Solution Implemented *
        </label>
        <textarea
          id="new-prob-solution"
          rows="3"
          required
          placeholder="Describe how you solved it: the fix, architectural change, defensive logic, or protocol used..."
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
        ></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
            Outcome / Proof of Resolution
          </label>
          <input
            id="new-prob-outcome"
            type="text"
            placeholder="e.g. Zero duplicate payments across 14k transactions"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
          />
        </div>

        <div>
          <label class="block text-[11px] font-mono font-bold uppercase tracking-wider text-[#8C8378] mb-1">
            Tech Stack Tags (Comma-separated)
          </label>
          <input
            id="new-prob-tech"
            type="text"
            placeholder="e.g. PostgreSQL, Go, ACID, M-Pesa IPN"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] text-xs text-[#2B2A28] focus:outline-none focus:border-[#2B2A28]"
          />
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#C4BCB2]">
        <button
          type="button"
          onclick="closeModal()"
          class="px-4 py-2.5 rounded-xl text-xs font-mono text-[#2B2A28] border border-[#C4BCB2] hover:bg-[#F0EBE3] cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-6 py-2.5 rounded-xl text-xs font-mono font-bold bg-[#2B2A28] text-[#FAF7F2] hover:bg-[#8C8378] transition-colors cursor-pointer shadow-xs"
        >
          Publish Problem Case
        </button>
      </div>
    </form>

  </div>
</div>
