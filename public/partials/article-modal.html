<!-- Article Reader Modal Partial -->
<div class="fixed inset-0 z-50 bg-[#2B2A28]/60 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in">
  <div class="w-full max-w-2xl rounded-3xl bg-[#FAF7F2] border border-[#C4BCB2] shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
    
    <div class="p-6 bg-[#F0EBE3] border-b border-[#C4BCB2] flex items-center justify-between">
      <div>
        <div id="modal-art-badge" class="text-[10px] font-mono uppercase tracking-wider text-[#8C8378] font-bold">
          Technical Analysis
        </div>
        <h3 id="modal-art-title" class="text-xl font-serif font-bold text-[#2B2A28] mt-1">
          Article Title
        </h3>
      </div>
      <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#FAF7F2] border border-[#C4BCB2] flex items-center justify-center text-sm font-bold text-[#8C8378] hover:text-[#2B2A28] cursor-pointer">
        &times;
      </button>
    </div>

    <div class="p-6 overflow-y-auto space-y-4 text-xs sm:text-sm text-[#2B2A28]/90 leading-relaxed font-sans flex-1">
      <div class="flex items-center gap-3 pb-3 border-b border-[#C4BCB2] text-xs font-mono text-[#8C8378]">
        <span id="modal-art-author" class="font-bold text-[#2B2A28]">Author Name</span>
        <span>&bull;</span>
        <span id="modal-art-date">Date</span>
      </div>

      <div id="modal-art-body" class="space-y-4">
        <!-- Body injected here -->
      </div>
    </div>

    <div class="p-4 bg-[#F0EBE3] border-t border-[#C4BCB2] flex items-center justify-between">
      <a
        href="https://wa.me/255628726374?text=Hello%20Ibrahim%2C%20I%20read%20your%20article"
        target="_blank"
        rel="noopener noreferrer"
        class="text-xs font-mono font-bold text-emerald-800 hover:underline flex items-center gap-1.5"
      >
        <span>Discuss this article with Ibrahim on WhatsApp &rarr;</span>
      </a>
      <button
        onclick="closeModal()"
        class="px-4 py-2 rounded-xl text-xs font-mono bg-[#FAF7F2] text-[#2B2A28] border border-[#C4BCB2] hover:bg-[#E7E0D6] cursor-pointer"
      >
        Close
      </button>
    </div>

  </div>
</div>
