<div id="edit-profile-backdrop" class="fixed inset-0 z-50 bg-[#2B2A28]/70 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto animate-fade-in">
  <div class="w-full max-w-2xl rounded-2xl bg-[#FAF7F2] border border-[#C4BCB2] shadow-2xl overflow-hidden flex flex-col my-auto max-h-[92vh]">
    
    <!-- Header -->
    <div class="p-4 bg-[#F0EBE3] border-b border-[#C4BCB2] flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></div>
        <span class="text-xs font-mono font-bold text-[#2B2A28] uppercase tracking-wider">
          Edit Proofolio Identity &bull; Stage 1
        </span>
      </div>
      <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-[#FAF7F2] border border-[#C4BCB2] text-[#8C8378] hover:text-[#2B2A28] hover:bg-[#E7E0D6] flex items-center justify-center text-xs font-mono cursor-pointer transition-colors">
        ✕
      </button>
    </div>

    <!-- Form Body -->
    <form id="profile-edit-form" onsubmit="handleProfileEditSubmit(event)" class="p-6 overflow-y-auto space-y-6 text-xs font-mono">
      
      <div id="edit-alert" class="hidden p-3 rounded-xl border text-xs"></div>

      <!-- Visibility Selection Box -->
      <div class="p-4 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] space-y-3">
        <div class="font-bold text-[#2B2A28] uppercase text-[11px] tracking-wider flex items-center justify-between">
          <span>Profile Visibility Level</span>
          <span class="text-[10px] font-normal text-[#8C8378]">Controls privacy and discovery</span>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
          <label class="p-3 rounded-xl bg-[#FAF7F2] border border-[#C4BCB2] has-checked:border-[#2B2A28] has-checked:bg-white cursor-pointer flex flex-col justify-between">
            <div class="flex items-center gap-2">
              <input type="radio" name="visibility" value="public" id="vis-public" class="accent-[#2B2A28]" checked />
              <span class="font-bold text-[#2B2A28]">PUBLIC</span>
            </div>
            <p class="text-[10px] text-[#8C8378] mt-1.5 leading-relaxed">Visible to everyone. Listed in public discovery searches.</p>
          </label>

          <label class="p-3 rounded-xl bg-[#FAF7F2] border border-[#C4BCB2] has-checked:border-[#2B2A28] has-checked:bg-white cursor-pointer flex flex-col justify-between">
            <div class="flex items-center gap-2">
              <input type="radio" name="visibility" value="unlisted" id="vis-unlisted" class="accent-[#2B2A28]" />
              <span class="font-bold text-[#2B2A28]">UNLISTED</span>
            </div>
            <p class="text-[10px] text-[#8C8378] mt-1.5 leading-relaxed">Accessible via direct link only. Not promoted in public directory.</p>
          </label>

          <label class="p-3 rounded-xl bg-[#FAF7F2] border border-[#C4BCB2] has-checked:border-[#2B2A28] has-checked:bg-white cursor-pointer flex flex-col justify-between">
            <div class="flex items-center gap-2">
              <input type="radio" name="visibility" value="private" id="vis-private" class="accent-[#2B2A28]" />
              <span class="font-bold text-[#2B2A28]">PRIVATE</span>
            </div>
            <p class="text-[10px] text-[#8C8378] mt-1.5 leading-relaxed">Only you and administrators can view portfolio content.</p>
          </label>
        </div>
      </div>

      <!-- Identity Fields -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
            Display Name
          </label>
          <input
            type="text"
            id="edit-display-name"
            required
            placeholder="e.g. Ibrahim Kimaro"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
          />
        </div>

        <div>
          <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
            Primary Focus / Category
          </label>
          <select
            id="edit-category"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
          >
            <option value="developer">Software Developer / Programmer</option>
            <option value="cybersecurity">Cybersecurity Learner / Professional</option>
            <option value="designer">Product / UI/UX Designer</option>
            <option value="student">Student / Academic Learner</option>
            <option value="researcher">Researcher / Scientist</option>
            <option value="engineer">Systems / Hardware / Civil Engineer</option>
            <option value="entrepreneur">Entrepreneur / Business Founder</option>
            <option value="other">General Professional / Hobbyist</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
          Headline
        </label>
        <input
          type="text"
          id="edit-headline"
          placeholder="e.g. Systems Engineer &amp; Full-Stack Architect"
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
        />
        <span class="text-[10px] text-[#8C8378]">A concise summary of what you build, learn, or solve.</span>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
            General Location
          </label>
          <input
            type="text"
            id="edit-location"
            placeholder="e.g. Dar es Salaam, Tanzania"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
          />
        </div>

        <div>
          <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
            Avatar URL (Optional)
          </label>
          <input
            type="url"
            id="edit-avatar-url"
            placeholder="https://example.com/avatar.jpg"
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
          />
        </div>
      </div>

      <div>
        <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
          Biography
        </label>
        <textarea
          id="edit-bio"
          rows="3"
          placeholder="Describe your background, what problems you solve, and what you are learning..."
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28] resize-y"
        ></textarea>
      </div>

      <div>
        <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
          Skills &amp; Proficiencies (Comma-separated)
        </label>
        <input
          type="text"
          id="edit-skills"
          placeholder="e.g. Python, Network Security, PostgreSQL, Figma, User Research"
          class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
        />
        <span class="text-[10px] text-[#8C8378]">Separate skills with commas.</span>
      </div>

      <!-- Education and Professional Summary -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
            Education Summary
          </label>
          <textarea
            id="edit-education"
            rows="2"
            placeholder="Degrees, certifications, bootcamps, or self-study tracks..."
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28] resize-y"
          ></textarea>
        </div>

        <div>
          <label class="block uppercase tracking-wider text-[#8C8378] mb-1 font-bold text-[11px]">
            Professional Experience Summary
          </label>
          <textarea
            id="edit-experience"
            rows="2"
            placeholder="Previous roles, freelance consulting, or research projects..."
            class="w-full px-3.5 py-2.5 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28] resize-y"
          ></textarea>
        </div>
      </div>

      <!-- Social & Web Links -->
      <div class="space-y-3 pt-2 border-t border-[#C4BCB2]">
        <div class="font-bold text-[#2B2A28] uppercase text-[11px] tracking-wider">
          External Web &amp; Social Links
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[10px] text-[#8C8378] mb-0.5">Website / Portfolio URL</label>
            <input
              type="url"
              id="edit-link-website"
              placeholder="https://mywebsite.com"
              class="w-full px-3 py-2 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
            />
          </div>

          <div>
            <label class="block text-[10px] text-[#8C8378] mb-0.5">GitHub / Code Repository</label>
            <input
              type="url"
              id="edit-link-github"
              placeholder="https://github.com/username"
              class="w-full px-3 py-2 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
            />
          </div>

          <div>
            <label class="block text-[10px] text-[#8C8378] mb-0.5">LinkedIn Profile</label>
            <input
              type="url"
              id="edit-link-linkedin"
              placeholder="https://linkedin.com/in/username"
              class="w-full px-3 py-2 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28]"
            />
          </div>
        </div>
      </div>

      <!-- STAGE 5: PROFILE THEME & TYPOGRAPHY CUSTOMIZER -->
      <div class="space-y-3 pt-3 border-t border-[#C4BCB2]">
        <div class="flex items-center justify-between">
          <div class="font-bold text-[#2B2A28] uppercase text-[11px] tracking-wider flex items-center gap-1.5">
            <span>🎨</span>
            <span>Stage 5: Portfolio Theme &amp; Visual Identity</span>
          </div>
          <span class="text-[10px] font-mono text-[#8C8378]">Applies to your public profile view</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-[10px] text-[#8C8378] mb-0.5 uppercase font-bold">Canvas Theme</label>
            <select
              id="edit-theme"
              class="w-full px-3 py-2 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28] text-xs font-mono"
            >
              <option value="editorial">Editorial Stone Paper (Default)</option>
              <option value="minimalist">Minimalist White Studio</option>
              <option value="cyber">Cyber Obsidian Terminal (Dark)</option>
              <option value="nord">Nordic Deep Slate</option>
              <option value="sepia">Sepia Classical Archive</option>
              <option value="contrast">High-Contrast Monochrome</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] text-[#8C8378] mb-0.5 uppercase font-bold">Typography Voice</label>
            <select
              id="edit-font-style"
              class="w-full px-3 py-2 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28] text-xs font-mono"
            >
              <option value="serif">Literary Serif (Newsreader)</option>
              <option value="sans">Modern Sans (Plus Jakarta)</option>
              <option value="mono">Hacker Monospace (JetBrains Mono)</option>
              <option value="classical">Classical Display (Fraunces)</option>
            </select>
          </div>

          <div>
            <label class="block text-[10px] text-[#8C8378] mb-0.5 uppercase font-bold">Brand Accent Tone</label>
            <select
              id="edit-accent-color"
              class="w-full px-3 py-2 rounded-xl bg-[#F0EBE3] border border-[#C4BCB2] focus:border-[#2B2A28] focus:outline-none text-[#2B2A28] text-xs font-mono"
            >
              <option value="#2B2A28">Charcoal Slate (#2B2A28)</option>
              <option value="#059669">Emerald Architecture (#059669)</option>
              <option value="#4F46E5">Royal Indigo (#4F46E5)</option>
              <option value="#D97706">Amber Gold (#D97706)</option>
              <option value="#E11D48">Crimson Rose (#E11D48)</option>
              <option value="#0891B2">Cyan Systems (#0891B2)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="pt-4 border-t border-[#C4BCB2] flex items-center justify-end gap-3">
        <button
          type="button"
          onclick="closeModal()"
          class="px-4 py-2.5 rounded-xl bg-[#FAF7F2] border border-[#C4BCB2] text-[#8C8378] hover:text-[#2B2A28] hover:bg-[#E7E0D6] transition-colors cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="submit"
          id="edit-save-btn"
          class="px-6 py-2.5 rounded-xl font-bold bg-[#2B2A28] text-[#FAF7F2] hover:bg-[#8C8378] transition-colors cursor-pointer shadow-xs flex items-center gap-2"
        >
          <span>Save Changes</span>
          <span>&rarr;</span>
        </button>
      </div>

    </form>

  </div>
</div>
